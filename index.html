<!doctype html>
<html lang="en" class="dark bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL - Interview Preparation Library</title>
    <script>
      // GitHub Pages SPA router: If this raw root file is served statically on GitHub Pages,
      // route immediately to /docs/ preserving the complete URL hash (#/...) and search parameters.
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isLocal) {
          var path = window.location.pathname;
          if (!path.includes('/docs')) {
            var target = path.replace(/\/+$/, '') + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-zinc-100 min-h-screen">
    <div id="root" class="min-h-screen w-full bg-black"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
